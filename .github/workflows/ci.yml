# Build and test OST/PST Studio on a GitHub-hosted Windows runner.
#
# Every push and pull request: formatting, clippy with warnings denied, the full test
# suite against the public fixtures, the TypeScript check, the production front end, the
# Tauri bundle (NSIS and MSI), the command-line tool, and an independent read of a
# converted file with libpff. The installers and executables are uploaded as workflow
# artifacts so anyone can download exactly what the committed source builds.
#
# Nothing here signs anything. See docs/CODE_SIGNING_POLICY.md.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python (for the libpff comparison)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm packages
        run: npm ci

      # Real PSTs are never committed. These are the public fixtures from hrbrmstr/freepst;
      # without them most engine tests skip themselves and a green run would mean little.
      - name: Fetch test fixtures
        shell: pwsh
        run: .\scripts\fetch-fixtures.ps1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Fuzz the recovery paths (more rounds than the default)
        run: cargo test --release --locked -p ostpst-core --test fuzz
        env:
          OSTPST_FUZZ_ROUNDS: "200"

      - name: TypeScript check
        run: npm run typecheck

      - name: Command-line tool
        run: cargo build --release --locked -p ostpst-cli

      - name: Desktop application and installers
        run: npm run tauri build -- --ci

      - name: Convert the OST fixture and verify it independently with libpff
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          .\target\release\ostpst.exe convert fixtures\data\example-2013.ost out\converted.pst --report out\convert-report.json --quiet
          .\target\release\ostpst.exe repair fixtures\data\dist-list.pst out\repaired.pst --report out\repair-report.json --quiet
          python -m pip install --quiet libpff-python
          python tests\libpff_compare.py fixtures\data\example-2013.ost out\converted.pst
          python tests\libpff_compare.py fixtures\data\dist-list.pst out\repaired.pst

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem target\release\bundle -Recurse -File | Select-Object FullName, Length

      - name: Upload installers and executables
        uses: actions/upload-artifact@v4
        with:
          name: ostpst-studio-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/ostpst-studio.exe
            target/release/ostpst.exe

      - name: Upload conversion reports
        uses: actions/upload-artifact@v4
        with:
          name: conversion-reports-${{ github.sha }}
          path: out/*.json

  # A published advisory against anything in the tree is something to find out about
  # from CI rather than from a user. Separate from the build so a new advisory reports
  # itself without also failing the binaries.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
