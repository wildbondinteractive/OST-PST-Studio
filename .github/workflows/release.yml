# Build a release of OST/PST Studio from a tag and attach the artifacts to a DRAFT
# GitHub Release. A maintainer publishes the draft by hand after checking it.
#
# Signing: the "sign" job submits the unsigned artifacts to SignPath and waits for
# manual approval there. It runs only when the repository has the SignPath secret and
# variable configured (see docs/CODE_SIGNING_POLICY.md, "Preparing for SignPath").
# Until then it is skipped and the release is published unsigned, and says so.
#
# Tag with: git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 from the tag
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag must match the manifests
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "tag=$tag cargo=$cargo npm=$npm tauri=$tauri"
          if ("${{ github.event_name }}" -eq "push" -and ($tag -ne $cargo -or $tag -ne $npm -or $tag -ne $tauri)) {
            throw "the tag version must equal the version in Cargo.toml, package.json and tauri.conf.json"
          }
          "version=$cargo" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch test fixtures
        shell: pwsh
        run: .\scripts\fetch-fixtures.ps1

      - name: Tests
        run: cargo test --workspace --locked

      - name: Command-line tool
        run: cargo build --release --locked -p ostpst-cli

      - name: Desktop application and installers
        run: npm run tauri build -- --ci

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe release\
          Copy-Item target\release\bundle\msi\*.msi release\
          Copy-Item target\release\ostpst-studio.exe release\OST-PST-Studio_${{ steps.version.outputs.version }}_x64-portable.exe
          Copy-Item target\release\ostpst.exe release\ostpst_${{ steps.version.outputs.version }}_x64.exe
          Get-ChildItem release | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: unsigned-artifacts
          if-no-files-found: error
          path: release/*

  # Inactive until the SignPath application is approved and the secret and variable
  # exist. No credential is stored in this file.
  sign:
    name: Sign with SignPath (manual approval)
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit the unsigned artifacts for signing
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: OST-PST-Studio
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          artifact-configuration-slug: windows-installers
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: signed-artifacts
          path: signed/*

  publish:
    name: Draft the GitHub Release
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts (signed when the signing job ran, unsigned otherwise)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'signed-artifacts' || 'unsigned-artifacts' }}
          path: release
      - name: Checksums of the files being published
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        shell: bash
        run: |
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "## Code signing policy"
            echo
            if [ "${{ needs.sign.result }}" = "success" ]; then
              echo "Free code signing provided by SignPath.io, certificate by SignPath Foundation."
            else
              echo "These binaries are NOT code-signed. Windows SmartScreen will warn on first run."
            fi
            echo "See https://github.com/${{ github.repository }}/blob/main/docs/CODE_SIGNING_POLICY.md"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: OST/PST Studio ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: release/*
