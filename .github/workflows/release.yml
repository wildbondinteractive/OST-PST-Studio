# Build, sign, verify and publish a release of OST/PST Studio from a version tag.
#
# One Windows job does the work, in this order, because the Tauri bundler rewrites a
# bundle-type marker inside the executable before packaging each installer (so a copy
# signed in advance would no longer verify), and because the installers must be signed
# after they are built:
#
#   1. check the tag against the versions in the manifests
#   2. build and test from the tag; build the executables without installers
#   3. log in to Azure with OIDC (no secrets anywhere)
#   4. `tauri bundle` with src-tauri/tauri.release.conf.json, whose sign command,
#      scripts/azure-sign.ps1, signs the executable for each installer right after the
#      bundler has prepared it, and then signs each finished installer
#   5. sign the portable executable and the command-line tool with the official
#      azure/artifact-signing-action (same signing component, same settings)
#   6. verify every file to be published, including the executable unpacked from
#      inside each installer
#   7. sign the two finished installers for the in-app updater (minisign, Tauri's key,
#      the version bound into the signature), after every Authenticode signature exists
#      and has verified, so the updater signature covers the exact bytes users download
#   8. verify those signatures with the application's own public key, write latest.json
#      (stable tags only) from the verified files, and verify the manifest as installed
#      copies will read it
#   9. write SHA256SUMS.txt and upload the set as one artifact
#
# A second job attaches that set to a draft GitHub Release. It runs only when the first
# job succeeded, so an unsigned or unverified file can never reach a release. There is
# no unsigned fallback: a signing or verification failure fails the run.
#
# Signing runs under the protected `release-signing` environment: GitHub issues an OIDC
# token for this job that Entra ID exchanges for a short-lived Azure credential
# (workload identity federation). No Azure secret, password or key exists in this
# repository or in GitHub. The environment holds identifiers only (client, tenant,
# subscription, endpoint, account, certificate profile). See docs/AZURE_CODE_SIGNING.md.
#
# The one secret is the in-app updater's minisign private key (TAURI_SIGNING_PRIVATE_KEY,
# and its password), held on the same protected environment and used only by the step
# that signs the installers for the updater. It is a different key from the Authenticode
# certificate and proves a different thing: that an update offered inside the app was
# produced by this workflow. See docs/UPDATER.md.
#
# The update manifest only becomes visible to installed copies when the draft release is
# published: they read github.com/<repo>/releases/latest/download/latest.json, which
# resolves to the newest published, non-prerelease release. A draft or a prerelease is
# never served there, and release candidates get no manifest at all.
#
# Tag with: git tag v1.2.3 && git push origin v1.2.3     (or v1.2.3-rc.1 for a pre-release)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and sign, e.g. v0.1.2 or v0.1.2-rc.1"
        required: true
        type: string

# The default for every job is read-only; jobs ask for what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The version of the ArtifactSigning PowerShell module that azure/artifact-signing-action@v2
  # pins; scripts/azure-sign.ps1 uses the same one so both signing paths are identical.
  ARTIFACT_SIGNING_MODULE_VERSION: "0.1.20"

jobs:
  build-sign-verify:
    name: Build, sign and verify (Windows x64)
    # windows-2025 and windows-2022 are the runners the Artifact Signing action supports.
    runs-on: windows-2025
    timeout-minutes: 90
    environment: release-signing
    permissions:
      id-token: write # the OIDC token Azure exchanges for a signing credential
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Only a release tag is ever signed: v1.2.3, or v1.2.3-rc.N for a pre-release. A
      # branch build, a pull request or an arbitrary ref is refused here, and the
      # `release-signing` environment carries the same tag rule on GitHub's side.
      - name: Resolve and check the release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -ne "tag") {
            throw "the release workflow runs for tags only, not for '${{ github.ref }}'"
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-rc\.\d+)?$') {
            throw "'$tag' is not a release tag; expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N"
          }
          $version = $Matches[1]
          $prerelease = [bool]$Matches[2]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Release tag $tag, version $version, pre-release: $prerelease"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Tag must exist and match the manifests
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          if (-not (git tag --list $tag)) { throw "tag '$tag' does not exist in the repository" }
          $want = "${{ steps.tag.outputs.version }}"
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "tag=$tag cargo=$cargo npm=$npm tauri=$tauri"
          if ($want -ne $cargo -or $want -ne $npm -or $want -ne $tauri) {
            throw "the tag's version ($want) must equal the version in Cargo.toml, package.json and src-tauri/tauri.conf.json"
          }

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm packages
        run: npm ci

      - name: Fetch test fixtures
        shell: pwsh
        run: .\scripts\fetch-fixtures.ps1

      - name: Tests
        run: cargo test --workspace --locked
      - name: TypeScript check
        run: npm run typecheck

      # Build everything first; nothing is signed until every binary exists.
      - name: Build the command-line tool
        run: cargo build --release --locked -p ostpst-cli
      - name: Build the desktop application (front end and executable, no installers yet)
        run: npm run tauri build -- --ci --no-bundle

      - name: Version resources must carry the release version
        shell: pwsh
        run: |
          $want = "${{ steps.tag.outputs.version }}"
          foreach ($f in "target\release\ostpst-studio.exe", "target\release\ostpst.exe") {
            $v = (Get-Item $f).VersionInfo
            "$f  product='$($v.ProductName)' version='$($v.ProductVersion)'"
            if (-not $v.ProductVersion.StartsWith($want)) { throw "$f carries version '$($v.ProductVersion)', expected $want" }
          }

      # ---- Signing -------------------------------------------------------------------
      - name: Install the Artifact Signing PowerShell module (pinned, same as the action)
        shell: pwsh
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion $env:ARTIFACT_SIGNING_MODULE_VERSION -Force -Repository PSGallery
          Import-Module ArtifactSigning
          "ArtifactSigning $((Get-Module ArtifactSigning).Version)"

      # Workload identity federation: the job's OIDC token is exchanged for an Azure CLI
      # session for the Entra application. Nothing here is a secret; the values are
      # identifiers held as variables on the `release-signing` environment.
      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The bundler calls scripts/azure-sign.ps1 (named in tauri.release.conf.json) for the
      # executable once per installer, after writing that installer's marker into it, and
      # then for each finished installer. `tauri bundle` runs no cargo build.
      - name: Build and sign the installers (executable signed inside each)
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: npx tauri bundle --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      - name: Collect the release set
        shell: pwsh
        run: |
          $v = "${{ steps.tag.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          # GitHub turns spaces in asset names into dots, which would make the names in
          # SHA256SUMS.txt differ from what people download; so no spaces here.
          Copy-Item target\release\bundle\nsis\*.exe "release\OST-PST-Studio_${v}_x64-setup.exe"
          Copy-Item target\release\bundle\msi\*.msi "release\OST-PST-Studio_${v}_x64_en-US.msi"
          # The bundler restores the executable's marker to its plain state afterwards; the
          # portable build is that file, signed below as its own artifact.
          Copy-Item target\release\ostpst-studio.exe "release\OST-PST-Studio_${v}_x64-portable.exe"
          Copy-Item target\release\ostpst.exe "release\ostpst_${v}_x64.exe"
          $files = Get-ChildItem release -File
          if ($files.Count -ne 4) { throw "expected 4 files in the release set, found $($files.Count): $($files.Name -join ', ')" }
          $files | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }

      - name: Sign the portable executable and the command-line tool
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: |
            ${{ github.workspace }}\release\OST-PST-Studio_${{ steps.tag.outputs.version }}_x64-portable.exe
            ${{ github.workspace }}\release\ostpst_${{ steps.tag.outputs.version }}_x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OST/PST Studio
          description-url: https://github.com/${{ github.repository }}
          # Only the Azure CLI session from the login step may be used as a credential.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # ---- Verify everything, checksum -----------------------------------------------
      - name: Verify every file to be published, and the executable inside each installer
        shell: pwsh
        run: .\scripts\verify-signatures.ps1 -Path release -Embedded -ExpectedVersion "${{ steps.tag.outputs.version }}" -ExpectedSubject "${{ vars.RELEASE_SIGNER_SUBJECT }}"

      # ---- In-app updater ----------------------------------------------------------------
      - name: Sign the installers for the in-app updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "the TAURI_SIGNING_PRIVATE_KEY secret is not set on the release-signing environment (docs/UPDATER.md)"
          }
          $v = "${{ steps.tag.outputs.version }}"
          foreach ($f in "release\OST-PST-Studio_${v}_x64-setup.exe", "release\OST-PST-Studio_${v}_x64_en-US.msi") {
            # Writes <file>.sig; prints the signature (public), never the key.
            npx tauri signer sign --app-version $v $f | Out-Null
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$f.sig")) { throw "updater signing failed for $f" }
            "signed for the updater: $f"
          }

      - name: Build the updater signature verifier
        run: cargo build --release --locked -p ostpst-studio --example verify_update_signatures

      - name: Update manifest (stable releases only)
        if: steps.tag.outputs.prerelease != 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.tag.outputs.version }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}"
          $nsis = "OST-PST-Studio_${v}_x64-setup.exe"
          $msi = "OST-PST-Studio_${v}_x64_en-US.msi"
          $manifest = [ordered]@{
            version   = $v
            notes     = (Get-Content docs\RELEASE_NOTES.md -Raw).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64-nsis" = [ordered]@{ url = "$base/$nsis"; signature = (Get-Content "release\$nsis.sig" -Raw).Trim() }
              "windows-x86_64-msi"  = [ordered]@{ url = "$base/$msi"; signature = (Get-Content "release\$msi.sig" -Raw).Trim() }
            }
          }
          # UTF-8 without a byte order mark: the updater's JSON parser rejects one.
          [System.IO.File]::WriteAllText("$PWD\release\latest.json", ($manifest | ConvertTo-Json -Depth 5), [System.Text.UTF8Encoding]::new($false))
          Get-Content release\latest.json | Select-Object -First 3

      - name: Verify the updater signatures and the manifest with the app's public key
        shell: pwsh
        run: |
          $v = "${{ steps.tag.outputs.version }}"
          $files = "release\OST-PST-Studio_${v}_x64-setup.exe", "release\OST-PST-Studio_${v}_x64_en-US.msi"
          $verifyArgs = @("--config", "src-tauri/tauri.conf.json", "--version", $v)
          if ("${{ steps.tag.outputs.prerelease }}" -ne "true") {
            $verifyArgs += @("--manifest", "release/latest.json", "--url-prefix", "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/")
          }
          .\target\release\examples\verify_update_signatures.exe @verifyArgs @files
          if ($LASTEXITCODE -ne 0) { throw "updater signature verification failed" }
          # The signatures now live in latest.json; the release set publishes no loose .sig files.
          Remove-Item release\*.sig

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # Unix line endings, so `sha256sum -c` on any platform accepts the file.
          [System.IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content release\SHA256SUMS.txt

      - name: Upload the signed and verified release set
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          path: release/*

  publish:
    name: Draft the GitHub Release
    needs: build-sign-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-sign-verify.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build-sign-verify.outputs.tag }}
          path: release
      - name: The set is complete and matches its checksums
        shell: bash
        run: |
          cd release
          ls -l
          sha256sum -c SHA256SUMS.txt
          # Four binaries and the checksums, plus the update manifest for a stable release.
          want=5
          [ "${{ needs.build-sign-verify.outputs.prerelease }}" = "true" ] || want=6
          [ "$(ls -1 | wc -l)" -eq "$want" ] || { echo "expected $want files"; exit 1; }
          if [ "$want" -eq 6 ]; then test -s latest.json; fi
      - name: Release notes
        shell: bash
        run: |
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "## SHA-256"
            echo
            echo "Check a download with \`Get-FileHash <file> -Algorithm SHA256\` in PowerShell, or \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Draft the release with the signed files attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-sign-verify.outputs.tag }}
          name: OST/PST Studio ${{ needs.build-sign-verify.outputs.tag }}
          body_path: notes.md
          draft: true
          prerelease: ${{ needs.build-sign-verify.outputs.prerelease == 'true' }}
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: false
