[workspace]
resolver = "2"
members = ["crates/ostpst-core", "crates/ostpst-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wildbondinteractive/OST-PST-Studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
